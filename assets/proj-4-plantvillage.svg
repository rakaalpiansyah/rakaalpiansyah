  <text x="28" y="106" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="12.8" font-weight="400">Custom 4-block Convolutional Neural Network diagnosing</text>
  <text x="28" y="128" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="12.8" font-weight="400">plant leaf pathology across variable field lighting. Quantized</text>
  <text x="28" y="150" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="12.8" font-weight="400">to TensorFlow Lite for 6ms offline CPU edge inference.</text>

