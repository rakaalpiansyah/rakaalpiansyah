  <!-- Description -->
  <text x="28" y="106" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="12.8" font-weight="400">Cross-platform Flutter mobile app published globally on</text>
  <text x="28" y="128" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="12.8" font-weight="400">Google Play to manage focus intervals and prevent burnout.</text>
  <text x="28" y="150" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="12.8" font-weight="400">Uses modular clean architecture, 60 FPS state &amp; SQLite.</text>

